name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Build backend ───────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Spring Boot jar
        run: mvn package -DskipTests

      # ── 3. Build frontend ──────────────────────────────────
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: erp-web/package-lock.json

      - name: Build React app
        run: |
          cd erp-web
          npm ci
          npm run build

      # ── 4. Deploy to Azure VM ─────────────────────────────
      - name: Ensure server directories exist
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            sudo mkdir -p /srv/erp /srv/erp-web/dist
            sudo chown -R $USER:$USER /srv/erp /srv/erp-web

      - name: Copy backend jar
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          source: "target/Uni-1.0-SNAPSHOT.jar"
          target: "/srv/erp"
          strip_components: 1

      - name: Rename jar
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: mv /srv/erp/Uni-1.0-SNAPSHOT.jar /srv/erp/app.jar

      - name: Copy frontend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          source: "erp-web/dist/*"
          target: "/srv/erp-web/dist"
          strip_components: 2

      - name: Copy systemd service and Caddyfile
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          source: "deploy/erp.service,deploy/Caddyfile"
          target: "/tmp"
          strip_components: 1

      - name: Install configs and restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_HOST }}
          username: ${{ secrets.AZURE_USER }}
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            sudo mv /tmp/erp.service /etc/systemd/system/erp.service
            sudo mv /tmp/Caddyfile /etc/caddy/Caddyfile
            sudo systemctl daemon-reload
            sudo systemctl enable erp
            sudo systemctl restart erp
            sudo systemctl reload caddy
            sudo systemctl is-active --quiet erp && echo "erp is running"
